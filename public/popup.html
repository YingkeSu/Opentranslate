<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polyglot Translate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <section class="hero">
        <p class="eyebrow">Polyglot Translate</p>
        <h1>Quick Setup</h1>
        <p id="status" class="status">Checking background service...</p>
      </section>

      <form id="quick-settings" class="form">
        <label>
          Target language
          <input id="target-language" type="text" placeholder="zh-CN" />
        </label>

        <label>
          Primary provider
          <select id="primary-provider"></select>
        </label>

        <section class="provider-block">
          <div class="provider-block__head">
            <div>
              <h2>Configured Providers</h2>
              <p id="configured-provider-note">Edit one configured provider at a time.</p>
            </div>
          </div>

          <label>
            Provider to configure
            <select id="config-provider"></select>
          </label>

          <label>
            <span id="provider-key-label">API key</span>
            <input id="provider-key" type="password" />
          </label>

          <p id="provider-template-note" class="provider-note"></p>

          <div class="add-provider">
            <label>
              Add provider template
              <select id="add-provider-template"></select>
            </label>
            <button id="add-provider" type="button" class="secondary">Add</button>
          </div>
        </section>

        <div class="actions">
          <button type="submit">Save</button>
          <button id="open-options" type="button" class="secondary">Advanced</button>
        </div>
      </form>

      <p class="hint">Only configured providers appear in the editor. Add a template to enable a new provider.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
