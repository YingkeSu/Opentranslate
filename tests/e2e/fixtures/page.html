<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polyglot Extension Test Page</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 32%),
          linear-gradient(180deg, #f7efe2 0%, #ffffff 62%);
        color: #1f2937;
      }

      main {
        max-width: 780px;
        margin: 0 auto;
        padding: 56px 24px 96px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 40px;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 0 18px;
        font-size: 20px;
        line-height: 1.8;
      }

      .lead {
        color: #475569;
      }

      .card {
        margin-top: 28px;
        padding: 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="lead">Select the body copy below to trigger the browser extension UI.</p>
      <div class="card">
        <h1>Extension Interaction Fixture</h1>
        <p id="selection-source">Hello world</p>
        <p>
          This page exists only to verify that the content script, service worker and settings page cooperate as a
          browser extension rather than a plain web app.
        </p>
      </div>
    </main>
  </body>
</html>
